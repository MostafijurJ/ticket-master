server:
  port: 5730

spring:
  application:
    name: gateway-service

  #    redis: configuration
  data:
    redis:
      host: 'localhost'
      port: 6379


  cloud:
    gateway:
      routes:
        - id: event-service-route
          uri: lb://event-service
          predicates:
            - Path=/event/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5 # 5 requests per second
                redis-rate-limiter.burstCapacity: 10 # Burst capacity of 10 requests
                key-resolver: "#{@remoteAddrKeyResolver}"

        - id: search-service-route
          uri: lb://search-service
          predicates:
            - Path=/search/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5  # 5 requests per second
                redis-rate-limiter.burstCapacity: 10 # Burst capacity of 10 requests
                key-resolver: "#{@remoteAddrKeyResolver}"


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
