server:
  port: ${SERVER_PORT:1122}

eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: '${DISCOVERY_SERVER_URI:http://localhost:8761/eureka}'

spring:
  jpa:
    database-platform: postgres
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: false
        hbm2ddl:
          auto: update

datasource:
  master:
    url: ${MASTER_DB_URL:jdbc:postgresql://localhost:5432/ticket?currentSchema=master}
    username: ${MASTER_DB_USER:user}
    password: ${MASTER_DB_PASSWORD:password}
    maximum-pool-size: 50
    minimum-idle: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    pool-name: AccountMasterHikariCP
    validation-timeout: 5000
    leak-detection-threshold: 60000
  slave:
    url: ${SLAVE_DB_URL:jdbc:postgresql://localhost:5432/ticket?currentSchema=master}
    username: ${SLAVE_DB_USER:user}
    password: ${SLAVE_DB_PASSWORD:password}
    maximum-pool-size: 50
    minimum-idle: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    pool-name: AccountSlaveHikariCP
    validation-timeout: 5000
    leak-detection-threshold: 60000



redis:
  host: localhost
  port: 6379
  password:
  database:
    index: 10
  pool:
    max:
      connection: 30
      idle:
        connection: 10
    min:
      idle:
        connection: 0

logging:
  config: classpath:log/logback-dev.xml

