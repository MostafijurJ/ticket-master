server:
  port: ${SERVER_PORT:1144}

eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: '${DISCOVERY_SERVER_URI:http://localhost:8761/eureka}'

spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:mrkajol550@gmail.com}
    password: ${MAIL_PASSWORD:*************}
    personal: ${MAIL_DISPLAY_NAME:Ticket System Notification}
    properties:
        mail.transport.protocol: smtp
        mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
        mail.smtp.starttls.enable: ${MAIL_START_TLS_ENABLE:true}
        mail.smtp.starttls.required: ${MAIL_START_TLS_REQUIRED:true}
        mail.debug: ${MAIL_DEBUG:false}

  jpa:
    database-platform: postgres
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
        hbm2ddl:
          auto: validate
  config:
    import: kafka-dev.yml

datasource:
  master:
    url: ${MASTER_DB_URL:jdbc:postgresql://localhost:5432/ticket?currentSchema=notification}
    username: ${MASTER_DB_USER:user}
    password: ${MASTER_DB_PASSWORD:password}
    maximum-pool-size: 50
    minimum-idle: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    pool-name: MasterHikariCP
    validation-timeout: 5000
    leak-detection-threshold: 60000
  slave:
    url: ${SLAVE_DB_URL:jdbc:postgresql://localhost:5432/ticket?currentSchema=notification}
    username: ${SLAVE_DB_USER:user}
    password: ${SLAVE_DB_PASSWORD:password}
    maximum-pool-size: 50
    minimum-idle: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    pool-name: SlaveHikariCP
    validation-timeout: 5000
    leak-detection-threshold: 60000



redis:
  host: localhost
  port: 6379
  password:
  database:
    index: 11
  pool:
    max:
      connection: 30
      idle:
        connection: 10
    min:
      idle:
        connection: 0

logging:
  config: classpath:log/logback-dev.xml

