server:
  port: ${SERVER_PORT:1122}

eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: '${DISCOVERY_SERVER_URI:http://localhost:8761/eureka}'

spring:
  jpa:
    database-platform: postgres
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
        hbm2ddl:
          auto: validate

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket?currentSchema=master
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: BaseMasterHikariCP
      validation-timeout: 5000
      leak-detection-threshold: 60000


redis:
  host: localhost
  port: 6379
  password:
  database:
    index: 11
  pool:
    max:
      connection: 30
      idle:
        connection: 10
    min:
      idle:
        connection: 0

logging:
  config: classpath:log/logback-dev.xml

