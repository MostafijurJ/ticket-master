ms:
  kafka:
    bootstrap-servers: localhost:19093
    producer:
      compression-type: snappy
      acks: all
      batch-size: 16384
      batch-size-boost-factor: 100
      linger-ms: 5
      request-timeout-ms: ${KAFKA_REQUEST_TIME_OUT:180000}
      retry-count: ${KAFKA_RETRY_COUNT:0}
    consumer:
      group-id: ticketing
      auto-startup: true
      concurrency-level: 1
      session-timeout-ms: 120000
      heartbeat-interval-ms: 3000
      max-poll-interval-ms: 300000
      max-poll-records: 1
      max-partition-fetch-bytes-default: 1048576
      max-partition-fetch-bytes-boost-factor: 1
      poll-timeout-ms: 45000
    topic:
      ticket-generation-topic: TICKET_GENERATION
      notification-topic: NOTIFICATION_TOPIC
